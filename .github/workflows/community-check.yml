# Pull requests that add or change community tools: rebuild every tool from its source and check that the
# committed WAVs and catalog are exactly what the sources build. Read-only, no secrets.
name: Community tools check
on:
  pull_request:
    paths:
      - 'community/**'
      - 'docs/community/**'
      - 'tools/community.py'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/community.py verify
