<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MPC500 MIDI Screen</title>
<style>
  body { background: #141518; color: #e7e7ea; font: 16px -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; padding-top: 36px; margin: 0 8px; }
  .lcd { background: #b9d27a; color: #1f2a12; font: 700 min(34px, 5.4vw)/1.2 ui-monospace, Menlo, monospace; padding: 14px 22px; border-radius: 10px;
         border: 10px solid #0d0e10; white-space: pre; letter-spacing: 2px; margin-top: 22px; }
  canvas { width: min(1024px, 96vw); height: auto; background: #1d1f24; border: 1px solid #33363d; border-radius: 10px; }
  #info { margin-top: 10px; font: 15px ui-monospace, Menlo, monospace; color: #e7e7ea; }
  .lcd .cur { background: #1f2a12; color: #b9d27a; border-radius: 3px; }
  #st { margin-top: 14px; color: #9a9ca3; font: 13px ui-monospace, Menlo, monospace; }
  button { margin-top: 16px; font-size: 16px; padding: 8px 16px; }
  #views { margin-top: 18px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .vtitle { color: #9a9ca3; font: 13px ui-monospace, Menlo, monospace; }
  .mrow { display: grid; grid-template-columns: 28px repeat(12, min(52px, 6.5vw)); gap: 5px; align-items: center; }
  .mrow.cur .bk { color: #e7e7ea; font-weight: 700; }
  .bk { color: #6a6c73; font: 14px ui-monospace, Menlo, monospace; text-align: center; }
  .pd { height: min(40px, 6vw); border-radius: 6px; background: #3f8f4e; color: #0d0e10; font: 700 12px ui-monospace, Menlo, monospace;
        display: flex; align-items: center; justify-content: center; }
  .grow { display: grid; grid-template-columns: 40px repeat(16, min(30px, 4.6vw)); gap: 3px; align-items: center; }
  .gs { height: min(22px, 4vw); border-radius: 4px; background: #2a2c31; } .gs.q { background: #34373e; }
  .gs.on { background: #ff4a3d; } .gs.cur { outline: 2px solid #e7e7ea; } .bk.selp { color: #ff4a3d; font-weight: 700; }
  .srow { display: grid; grid-template-columns: repeat(12, min(52px, 7vw)); gap: 5px; }
  .sp { background: #2a2c31; border-radius: 6px; text-align: center; padding: 6px 0; font: 13px ui-monospace, Menlo, monospace; }
  .sp b { display: block; font-size: 16px; color: #e0c04a; } .sp span { color: #8a8c93; font-size: 11px; }
  .pd.m { background: #c8453a; } .pd.s { background: #e0c04a; } .pd.z { background: #3a3c42; color: #8a8c93; }
</style>
</head>
<body>
<canvas id="wv" width="1024" height="260"></canvas>
<div id="info">nessun sample</div>
<div class="lcd" id="lcd">
                </div>
<div id="views"></div>
<div id="st">premi "Collega" (Chrome: consenti i messaggi SysEx)</div>
<button id="go">Collega</button>
<script src="o5link.js"></script>
<script>
// Schermo remoto Open500: tutto il protocollo e' in o5link.js; qui solo il disegno.
// Trasporto: Web MIDI (Chrome desktop/Android) oppure il ponte nativo della companion app (window.O5Native).
var cv = document.getElementById('wv'), g = cv.getContext('2d'), lcd = document.getElementById('lcd'),
    info = document.getElementById('info'), st = document.getElementById('st'), vbox = document.getElementById('views');
var link = new O5Link.Link();
var S = { peaks: new Array(256).fill(0), have: new Array(8).fill(false), trim: null, chops: [], play: null, sig: -1 };
function ch(c) { return c === 0x7F ? '█' : c < 8 ? '□' : String.fromCharCode(c); }
function newsig(s) { if (s !== S.sig) { S.sig = s; S.trim = null; S.chops = []; S.play = null; } }
function draw() {
  var W = cv.width, H = cv.height, mid = H / 2, cw = W / 256, trim = S.trim, play = S.play, chops = S.chops;
  g.clearRect(0, 0, W, H);
  var x0 = 0, x1 = W;
  if (trim && trim.len > 0) { x0 = trim.start / trim.len * W; x1 = (trim.end + 1) / trim.len * W; }
  for (var c = 0; c < 256; c++) {
    var x = c * cw, h = S.peaks[c] / 127 * (H / 2 - 6), inside = x + cw > x0 && x < x1;
    g.fillStyle = !S.have[c >> 5] ? '#2a2c31' : inside ? '#ff4a3d' : '#5a3a38';
    g.fillRect(x, mid - h, Math.max(cw - 1, 1), Math.max(2 * h, 1));
  }
  if (trim && trim.len > 0) {
    g.fillStyle = 'rgba(0,0,0,0.45)'; g.fillRect(0, 0, x0, H); g.fillRect(x1, 0, W - x1, H);
    g.fillStyle = '#6cc070'; g.fillRect(x0 - 1, 0, 3, H);
    g.fillStyle = '#e0a84a'; g.fillRect(x1 - 2, 0, 3, H);
    if (play) {                                                    // fetta in ascolto + cursore (44100 campioni/s)
      var p0 = play.start / trim.len * W, p1 = (play.end + 1) / trim.len * W;
      g.fillStyle = 'rgba(127,212,255,0.22)'; g.fillRect(p0, 0, p1 - p0, H);
      var pos = Math.min(play.end, play.start + (performance.now() - play.t0) / 1000 * 44100);
      g.fillStyle = '#ffffff'; g.fillRect(pos / trim.len * W - 1, 0, 2, H);
    }
    for (var q = 0; q < chops.length; q++) {                       // tagli: linea + numero della fetta (= pad)
      var xc = chops[q] / trim.len * W, on = play && play.slice === q;
      g.fillStyle = on ? '#ffffff' : '#7fd4ff'; g.fillRect(xc - 1, 22, 2, H - 22);
      g.font = (on ? 'bold 15px' : 'bold 12px') + ' Menlo, monospace'; g.fillText(String(q + 1), xc + 3, H - 6);
    }
    g.font = '13px Menlo, monospace'; g.fillStyle = '#6cc070'; g.fillText('START', x0 + 5, 16);
    g.fillStyle = '#e0a84a'; g.fillText('END', Math.max(x1 - 32, x0 + 50), 16);
    var sec = function (f) { return (f / 44100).toFixed(3) + ' s'; };
    info.textContent = (chops.length ? 'Trans-Chop: ' + chops.length + ' fette   ' : '') + 'start ' + trim.start + ' (' + sec(trim.start) + ')   end ' + trim.end + ' (' + sec(trim.end) +
      ')   regione ' + sec(trim.end - trim.start + 1) + '   lunghezza ' + trim.len;
  } else info.textContent = 'nessun sample';
}
function anim() { draw(); if (S.play) requestAnimationFrame(anim); }
link.on('display', function (d) {
  var s = '';
  for (var i = 0; i < 32; i++) {
    var c = ch(d.text[i]).replace('&', '&amp;').replace('<', '&lt;');
    s += i === d.cursor ? '<span class="cur">' + c + '</span>' : c; if (i === 15) s += '\n';
  }
  lcd.innerHTML = s;
});
link.on('wave', function (w) { newsig(w.sig); S.peaks = w.peaks; S.have = w.have; draw(); });
link.on('trim', function (t) { newsig(t.sig); S.trim = t; draw(); });
link.on('chop', function (c) { newsig(c.sig); S.chops = c.positions; draw(); });
link.on('play', function (p) {
  newsig(p.sig); S.play = p.on ? { slice: p.slice, start: p.start, end: p.end, t0: performance.now() } : null;
  if (S.play) anim(); else draw();
});
link.on('stats', function (x) {
  st.textContent = 'pacchetti ' + x.ok + '  rovinati ' + x.bad + '  sample #' + S.sig + '  ' + new Date().toLocaleTimeString();
});
// ---- viste degli add-on (docs/PROTOCOL.md §5) ----
var NOTE = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
var SCALES = ['MAJOR', 'MINOR', 'DORIAN', 'PHRYG', 'LYDIAN', 'MIXOLYD', 'HARMMIN', 'PENTMAJ', 'PENTMIN', 'BLUES', 'CHROMA'];
function s8(x) { return x > 127 ? x - 256 : x; }
link.on('view', drawviews);
function drawviews() {
  var V = link.views, html = '';
  var mu = V[4];
  if (mu && mu.ver === 1 && mu.data.length >= 49) {                      // PAD MUTE: banco + 48 stati (bit0 mute, bit1 solo, bit2 zittito)
    html += '<div class="vtitle">PAD MUTE</div>';
    for (var b = 0; b < 4; b++) {
      html += '<div class="mrow' + (b === mu.data[0] ? ' cur' : '') + '"><div class="bk">' + 'ABCD'[b] + '</div>';
      for (var p = 0; p < 12; p++) {
        var f = mu.data[1 + b * 12 + p], c = f & 2 ? 's' : f & 1 ? 'm' : f & 4 ? 'z' : '';
        html += '<div class="pd ' + c + '">' + (f & 2 ? 'S' : f & 1 ? 'M' : '') + (p + 1) + '</div>';
      }
      html += '</div>';
    }
  }
  var gr = V[2];
  if (gr && gr.ver === 1 && gr.data.length >= 32) {                      // GRID SEQ: 12 pad x 16 step della battuta
    var d = gr.data, bars = d[0] | d[1] << 8, bank = d[5];
    html += '<div class="vtitle">GRID SEQ — bar ' + d[2] + '/' + bars + '  step ' + d[3] + '  track ' + (d[7] + 1) + '</div>';
    for (var r = 11; r >= 0; r--) {
      var mask = d[8 + 2 * r] | d[9 + 2 * r] << 8, sel = bank * 12 + r === d[4];
      html += '<div class="grow"><div class="bk' + (sel ? ' selp' : '') + '">' + 'ABCD'[bank] + ('0' + (r + 1)).slice(-2) + '</div>';
      for (var k = 0; k < 16; k++)
        html += '<div class="gs' + (mask >> k & 1 ? ' on' : '') + (k % 4 === 0 ? ' q' : '') + (sel && k === d[3] - 1 && !d[6] ? ' cur' : '') + '"></div>';
      html += '</div>';
    }
  }
  var sc = V[3];
  if (sc && sc.ver === 1 && sc.data.length >= 17) {                      // SCALE PADS: scala, tonalita', 12 note
    var dd = sc.data, ks = dd[1] <= 6 ? dd[1] : dd[1] - 12;
    html += '<div class="vtitle">SCALE PADS — ' + NOTE[dd[1]] + ' ' + (SCALES[dd[0]] || '?') + ' → bank ' + 'ABCD'[dd[2]] +
            (dd[3] === 2 ? '  (source ' + 'ABCD'[(dd[4] / 12) | 0] + ('0' + (dd[4] % 12 + 1)).slice(-2) + ', DO IT?)' : '') + '</div><div class="srow">';
    for (var i = 0; i < 12; i++) {
      var semi = s8(dd[5 + i]), oct = Math.floor((semi - ks) / 12);          // ottava contata dalla tonica (pad 1)
      html += '<div class="sp"><b>' + NOTE[((semi % 12) + 12) % 12] + '</b><span>' + (i + 1) + (oct ? (oct > 0 ? ' +' : ' ') + oct : '') + '</span></div>';
    }
    html += '</div>';
  }
  var sq = V[9];
  if (sq && sq.ver === 1 && sq.data.length >= 4)
    html += '<div class="vtitle">SEQ TOOLS — ' + (sq.data[0] | sq.data[1] << 8) + ' bars, ' + (sq.data[2] | sq.data[3] << 8) + ' events</div>';
  vbox.innerHTML = html;
}
draw();
function connect() {
  if (window.O5Native) {                                         // dentro la companion app: MIDI nativo (CoreMIDI)
    window.O5Native.start(function (bytes) { link.feedStream(bytes); }, function (info) { st.textContent = info; });
    link.setSender(function (m) { window.O5Native.send(m); });
    return;
  }
  link.on('ports', function (p) { st.textContent = p.inputs.length ? 'in ascolto su: ' + p.inputs.join(', ') : 'nessun ingresso MIDI trovato'; });
  link.connectWebMidi().catch(function (err) { st.textContent = String(err.message || err); });
}
document.getElementById('go').onclick = connect;
if (window.O5Native) connect();
</script>
</body>
</html>
